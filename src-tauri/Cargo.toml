[package]
name = "chapter"
version = "1.9.2"
description = "Chapter · 小方工作室出品 · 全中文、永久免费开源（MIT）的长篇小说写作工作台"
authors = ["小方工作室"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chapter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 中文 TXT 常见 GBK/GB18030，读入时做一次兜底解码
encoding_rs = "0.8"
# EPUB 3 直接在本机打包，不依赖外部工具
zip = { version = "2", default-features = false, features = ["deflate"] }
# 本机 MCP：只监听 127.0.0.1，给外部 AI 客户端提供 JSON-RPC 工具
tiny_http = "0.12"
# 手机互传：内容指纹与一次性口令
sha2 = "0.10"
fastrand = "2"
tauri-plugin-sharekit = "0.4.0-rc.8"
tauri-plugin-stt = { path = "vendor/tauri-plugin-stt" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"



